# Metadados e configuracao de ferramentas do MP Portal.
#
# As dependencias vivem aqui, em `[project]`, e nao em `requirements*.txt`: uma
# unica fonte serve ao `uv sync --locked` da imagem e ao venv de
# desenvolvimento. Os projetos irmaos seguem esta mesma forma.

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mp-portal"
version = "0.1.0"
description = "Portal da MP Solucoes: recebimento de contato do site e area administrativa."
readme = "README.md"
# Piso em 3.14 pelo mesmo motivo registrado no `sharedauth` e nos irmaos: e a
# unica versao que alguma imagem executa. Declarar outra coisa seria afirmar
# uma compatibilidade que nenhum job verifica.
requires-python = ">=3.14"
dependencies = [
  "Django>=5.2,<7",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=26.0.0,<27",
  "whitenoise>=6.12.0,<7",
  # Cabecalhos de seguranca, CSP e leitura de segredo por arquivo,
  # compartilhados com os outros aplicativos do mantenedor. A tag e fixada
  # manualmente e nunca aponta para branch.
  #
  # **Sem o extra `[flask]`**, de proposito, exatamente como o ControleBancario:
  # o nucleo do pacote e Python puro e nao tem dependencia nenhuma. Pedir o
  # extra traria Flask, Flask-WTF e Flask-Limiter para dentro de uma imagem
  # Django, que nao usa nada disso.
  "sharedauth @ git+https://github.com/MSPA-Coder/SharedAuth.git@v0.11.0",
]

[project.optional-dependencies]
# Instaladas apenas no estagio `quality` da imagem e no venv local, nunca no
# `runtime`. Vem sobre as de execucao, nao no lugar delas: a suite exercita a
# aplicacao real -- cabecalhos, CSRF, autorizacao e as restricoes do banco
# passam pelo cliente de teste do proprio Django, sem duble.
dev = [
  "ruff>=0.12,<1",
  "pytest>=8.3,<10",
  "pytest-django>=4.9,<5",
  # Auditoria de CVE das dependencias instaladas. Piso na minor atual, teto na
  # proxima major -- politica de faixa do mantenedor.
  "pip-audit>=2.10,<3",
]

# A distribuicao sao os proprios aplicativos Django, no layout plano que o
# `startapp` produz. `portal` e o pacote de configuracao (settings, urls,
# wsgi); os demais sao aplicativos de dominio. `manage.py`, `templates/` e
# `static/` ficam de fora: sao usados a partir do diretorio de trabalho, nao
# importados como modulo.
[tool.hatch.build.targets.wheel]
packages = [
  "portal",
  "core",
  "contas",
  "contatos",
]

# `sharedauth` e referencia direta a um repositorio Git (nao a um indice PyPI):
# Hatchling recusa isso por padrao e exige este opt-in explicito.
[tool.hatch.metadata]
allow-direct-references = true

# A secao [tool.ruff] e comum aos projetos irmaos; so `target-version` e
# `known-first-party` variam, porque dependem da versao de Python da imagem e do
# layout de pacotes. Mantenha o resto em sincronia.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # comprimento de linha: responsabilidade do formatador
    "RUF012", # `Meta` de model Django usa listas de classe por design
]
# Ao contrario do ControleBancario, este repositorio nasce sem a divida de
# tabulacao herdada da conversao Flask -> Django: `W191` e `W293` continuam
# ligados aqui, e devem continuar.

[tool.ruff.lint.isort]
known-first-party = [
    "portal",
    "core",
    "contas",
    "contatos",
    "tests",
]

[tool.ruff.lint.per-file-ignores]
# Migracoes Django sao geradas: a ordem de import e as expressoes longas de
# schema vem da ferramenta, e reescreve-las a mao so afasta o arquivo do que
# seria regerado.
"*/migrations/*.py" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portal.settings"
testpaths = ["tests"]
addopts = "-q --tb=short"
# Sem isto o pytest coloca `tests/` no sys.path em vez da raiz, e os apps
# Django nao sao importaveis dentro do conteiner.
pythonpath = ["."]
