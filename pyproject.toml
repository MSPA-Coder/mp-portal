# Metadados e configuracao de ferramentas do MP Portal.
#
# As dependencias vivem aqui, em `[project]`, e nao em `requirements*.txt`: uma
# unica fonte serve ao `uv sync --locked` da imagem e ao venv de
# desenvolvimento. Os projetos irmaos seguem esta mesma forma.

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mp-portal"
version = "0.2.0"
description = "Site institucional da MP Solucoes: gerador do site estatico para a hospedagem compartilhada."
readme = "README.md"
# Python 3.15 é a série padronizada nos venvs, imagens Docker e CI da frota.
requires-python = ">=3.15"
dependencies = [
  # So o motor de template, em tempo de build: nada disto roda na hospedagem.
  "Django>=5.2,<7",
  # Fonte da CSP e dos cabecalhos de seguranca que o gerador grava no
  # `.htaccess`, a mesma dos aplicativos irmaos. A tag e fixada manualmente e
  # nunca aponta para branch. Sem o extra `[flask]`: o nucleo e Python puro.
  "sharedauth @ git+https://github.com/MSPA-Coder/SharedAuth.git@v0.14.0",
]

[project.optional-dependencies]
# Instaladas apenas no estagio `quality` da imagem e no venv local. A suite
# gera o site de verdade e examina a saida, sem duble.
dev = [
  "ruff>=0.12,<1",
  "pytest>=8.3,<10",
  # Auditoria de CVE das dependencias instaladas. Piso na minor atual, teto na
  # proxima major -- politica de faixa do mantenedor.
  "pip-audit>=2.10,<3",
]

# `templates/`, `static/` e `php/` ficam de fora: sao lidos a partir do
# diretorio de trabalho pelo gerador, nao importados como modulo.
[tool.hatch.build.targets.wheel]
packages = ["institucional"]

# `sharedauth` e referencia direta a um repositorio Git (nao a um indice PyPI):
# Hatchling recusa isso por padrao e exige este opt-in explicito.
[tool.hatch.metadata]
allow-direct-references = true

# A secao [tool.ruff] e comum aos projetos irmaos; `target-version` e
# `known-first-party` variam, porque dependem da versao de Python da imagem e do
# layout de pacotes, e as regras `S` sao so deste repositorio (abaixo).

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    # flake8-bandit. Decidido em 15/09/2026 porque este e o unico repositorio sem
    # CodeQL: privado no plano gratuito (L11), e justamente o que atende dado de
    # terceiro. Cobre parte do que o CodeQL veria -- SQL montado com texto,
    # `subprocess` com shell, `pickle`, `mark_safe` --, sem plano pago. Ao
    # ligar, nada foi achado fora de `tests/`. Revisitar quando o repositorio
    # ganhar CodeQL.
    "S",
]
ignore = [
    "E501", # comprimento de linha: responsabilidade do formatador
]

[tool.ruff.lint.isort]
known-first-party = ["institucional", "tests"]

[tool.ruff.lint.per-file-ignores]
# `assert` e o idioma do pytest. As regras `S` valem para todo o resto.
"tests/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
# Sem isto o pytest coloca `tests/` no sys.path em vez da raiz.
pythonpath = ["."]
