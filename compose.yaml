name: mp-portal

# So ferramentas de build: nada aqui sobe na hospedagem. O site publicado e a
# pasta `dist/site`, gerada por `gerar` e enviada por arquivo.

x-build: &build
  # Nome fixo em vez do derivado do diretorio, para o nome da imagem nao mudar
  # conforme onde o repositorio foi clonado.
  image: mp-portal-quality:local
  pull_policy: build
  build:
    context: .
    pull: true
    no_cache: true
    target: quality
    secrets:
      - local_ca

# Mesma fronteira de privilegio nos dois servicos: usuario sem privilegio,
# sistema de arquivos de leitura e so /tmp e a saida gravaveis.
x-hardening: &hardening
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  # Ruff e a suite:
  #   docker compose run --build --rm quality
  # `--build` reconstrói explicitamente com as tags base atuais. A CI semanal
  # também faz build sem cache e executa testes, auditorias e Trivy.
  quality:
    <<: [*build, *hardening]
    tmpfs:
      - /tmp:mode=1777,rw,noexec,nosuid,size=64m

  # Gera o site em `dist/site`:
  #   DOMINIO=exemplo.com.br docker compose run --build --rm gerar
  # `COM_FORMULARIO=1` liga o formulario de contato -- so quando houver caixa de
  # e-mail que receba as solicitacoes. A pasta de saida e a unica gravavel.
  gerar:
    <<: [*build, *hardening]
    profiles: ["gerar"]
    command: ["python", "-m", "institucional.gerador", "--saida", "/dist/site"]
    environment:
      DOMINIO: ${DOMINIO:-}
      COM_FORMULARIO: ${COM_FORMULARIO:-0}
    volumes:
      - ./dist:/dist
    tmpfs:
      - /tmp:mode=1777,rw,noexec,nosuid,size=16m

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
