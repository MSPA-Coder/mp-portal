name: CI

on:
  push:
    branches: [main]
  # Sem filtro de `branches`, de proposito: assim a verificacao roda em PR para
  # QUALQUER base, e nao so para `main`. Com o filtro, um PR empilhado sobre
  # outro branch nao disparava check nenhum -- e o sintoma e a ausencia de
  # sinal, nao um vermelho.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Criar CA efêmera para o build
        run: |
          mkdir -p .certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/local-root-ca.key \
            -out .certs/local-root-ca.crt \
            -subj "/CN=MpPortal CI Local CA"
          rm -f /tmp/local-root-ca.key
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir quality sem cache
        run: docker compose build --pull --no-cache quality
      - name: Executar quality (Ruff e suite)
        run: docker compose run --rm quality

      # O Dependabot cobre atualizacoes; o pip-audit responde separadamente se a
      # versao instalada tem uma vulnerabilidade conhecida. Audita o ambiente
      # instalado na imagem, e nao o arquivo de requisitos: a pergunta e sobre o
      # que esta rodando, nao sobre o que esta escrito.
      #
      # Reprova em qualquer achado, de proposito. Vulnerabilidade sem correcao
      # publicada sai por `--ignore-vuln ID` com um comentario dizendo por que.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: docker compose run --rm quality pip-audit --progress-spinner=off --cache-dir /tmp/pip-audit-cache

      # O gerador roda como o usuario sem privilegio da imagem, entao a pasta de
      # saida precisa ser gravavel por ele.
      - name: Gerar o site com o formulário
        run: |
          mkdir -p dist && chmod 777 dist
          DOMINIO=exemplo.com.br COM_FORMULARIO=1 docker compose run --rm gerar
          test -f dist/site/index.html
          test -f dist/site/enviar.php
      - name: Testar o enviar.php (PHP 8.3)
        run: |
          docker run --pull=always --rm \
            -v "$PWD/php:/php:ro" -v "$PWD/dist/site:/site:ro" \
            php:8.3-cli sh /php/testar.sh

      - name: Varredura de vulnerabilidade da imagem de qualidade
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod 777 "$RUNNER_TEMP/trivy-cache"
          docker save mp-portal-quality:local -o "$RUNNER_TEMP/imagem.tar"
          docker compose -f .github/docker-compose.yml run --rm trivy \
            --cache-dir /tmp/trivy-cache \
            image --input /varredura/imagem.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table
