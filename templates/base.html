{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% comment %}
    A CSP do portal é `default-src 'self'` sem exceção: nada de <style> ou
    <script> embutido, nada de atributo style=. Estilo pontual vira classe em
    portal.css. O navegador bloqueia o que a CI não pega.

    `{% comment %}` e não `{# #}`: a forma com cerquilha só vale em UMA linha.
    Escrita em várias, ela deixa de ser comentário e o texto sai no HTML — foi
    o que aconteceu aqui, e o teste `test_nenhuma_pagina_vaza_sintaxe_de_template`
    existe por causa disso.
  {% endcomment %}
  <title>{% block titulo %}MP Portal{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
  {% block cabeca %}{% endblock %}
</head>
<body>
  <header class="topo">
    <a class="marca" href="/">MP <span>Portal</span></a>
    {% if user.is_authenticated %}
      <nav class="topo-acoes">
        <a href="{% url 'atendimento_lista' %}">Atendimento</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="botao-texto">Sair</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main class="conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    <p>MP Soluções — Segurança, Tecnologia e Facilities</p>
    <p><a href="{% url 'privacidade' %}">Aviso de privacidade</a></p>
  </footer>
</body>
</html>
